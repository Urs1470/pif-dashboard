<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="tokens-variante.css" />
</helmet>

<div data-var="{{ varianta }}" data-theme="{{ tema }}" style="position: relative; overflow: hidden; width: 100%; height: 100%; background: var(--bg); color: var(--text); font-family: var(--font-sans); -webkit-font-smoothing: antialiased;" data-screen-label="Acasă desktop">

  <span aria-hidden="true" style="position: absolute; inset: 0; z-index: 0; pointer-events: none; background: var(--halo, none);"></span>


  <sc-if value="{{ dockSus }}" hint-placeholder-val="{{ false }}">
    <span style="display: block; height: 80px; flex: none;"></span>
    <header style="position: absolute; z-index: 3; top: 14px; left: 18px; right: 18px; height: 54px; display: flex; align-items: center; gap: 18px; padding: 0 8px 0 18px; border-radius: var(--radius-full); box-shadow: var(--glass-rim, none), var(--glass-cast, var(--shadow-md)); isolation: isolate;" ref="{{ barRef }}">
      <span aria-hidden="true" style="position: absolute; inset: 0; border-radius: inherit; pointer-events: none; -webkit-backdrop-filter: var(--glass-filter, saturate(180%) blur(28px)); backdrop-filter: var(--glass-filter, saturate(180%) blur(28px));"></span>
      <span aria-hidden="true" style="position: absolute; inset: 0; border-radius: inherit; pointer-events: none; padding: 13px; -webkit-backdrop-filter: var(--glass-edge, blur(2px) saturate(170%) brightness(1.25)); backdrop-filter: var(--glass-edge, blur(2px) saturate(170%) brightness(1.25)); -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor; mask-composite: exclude;"></span>
      <span aria-hidden="true" style="position: absolute; inset: 0; border-radius: inherit; pointer-events: none; background: var(--glass-sheen, none), var(--glass-bg, var(--bar-bg));"></span>
      <span aria-hidden="true" style="position: absolute; inset: 0; border-radius: inherit; pointer-events: none; opacity: var(--spec, 0); transition: opacity .35s var(--ease); background: radial-gradient(150px 74px at calc(var(--mx, .5) * 100%) calc(var(--my, .5) * 100%), var(--glass-spec-a, rgba(255,255,255,.20)), var(--glass-spec-b, rgba(255,255,255,.06)) 42%, transparent 72%);"></span>
      <span style="position: relative; display: flex; align-items: center; gap: 9px; flex: none; font-family: var(--font-title); font-weight: var(--w-title); font-size: 0.9375rem; letter-spacing: var(--ls-title); color: var(--text); white-space: nowrap;">
        <svg width="40" height="40" viewBox="0 0 64 64" aria-hidden="true" style="flex: none; display: block;">
    <g fill="none" stroke="var(--accent)" stroke-linecap="round" stroke-linejoin="round">
      <path d="M17 32 A15 15 0 1 0 47 32 A15 15 0 1 0 17 32" stroke-width="5"></path>
      <path d="M22 32 C25.33 22.67 28.67 22.67 32 32 C35.33 41.33 38.67 41.33 42 32" stroke-width="4.2"></path>
    </g>
  </svg>
      </span>

      <nav style="position: relative; flex: 1; min-width: 0; display: flex; align-items: center; justify-content: center; gap: 2px; height: 100%;">
        <sc-for list="{{ nav }}" as="n" hint-placeholder-count="7">
          <span title="{{ n.label }}" style="position: relative; display: inline-flex; align-items: center; height: 34px; padding: 0 14px; border-radius: var(--radius-full); background: {{ n.bg }}; box-shadow: {{ n.ring }}; -webkit-backdrop-filter: saturate(200%) blur(20px); backdrop-filter: saturate(200%) blur(20px); font-size: 0.8125rem; font-weight: {{ n.w }}; letter-spacing: -0.005em; color: {{ n.col }}; white-space: nowrap; cursor: pointer; transition: var(--transition-colors);" style-hover="color: var(--text)">
            {{ n.label }}
          </span>
        </sc-for>
      </nav>

      <span style="position: relative; flex: none; display: flex; align-items: center; gap: 4px;">
        <span title="Caută (Ctrl+K)" style="width: 34px; height: 34px; display: grid; place-items: center; border-radius: var(--radius-full); color: var(--text-secondary); cursor: pointer; transition: var(--transition-colors);" style-hover="color: var(--text); background: var(--bg-hover)">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><path d="m21 21-4.3-4.3"></path></svg>
        </span>
        <button style="width: 34px; height: 34px; display: grid; place-items: center; border-radius: var(--radius-full); color: var(--text-secondary); transition: var(--transition-colors); cursor: pointer;" style-hover="color: var(--text); background: var(--bg-hover)" title="Temă" onClick="{{ comutaTema }}">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect width="20" height="14" x="2" y="3" rx="2"></rect><path d="M8 21h8"></path><path d="M12 17v4"></path></svg>
        </button>
      </span>
    </header>
  </sc-if>

  <sc-if value="{{ dockJos }}" hint-placeholder-val="{{ true }}">
  <header style="position: relative; z-index: 3; height: 56px; background: var(--bg); border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; padding: 0 24px;">
    <span style="display: flex; align-items: center; gap: 10px; font-family: var(--font-title); font-weight: var(--w-title); font-size: 1.125rem; letter-spacing: var(--ls-title); color: var(--text); white-space: nowrap;">
      <svg width="40" height="40" viewBox="0 0 64 64" aria-hidden="true" style="flex: none; display: block;">
    <g fill="none" stroke="var(--accent)" stroke-linecap="round" stroke-linejoin="round">
      <path d="M17 32 A15 15 0 1 0 47 32 A15 15 0 1 0 17 32" stroke-width="5"></path>
      <path d="M22 32 C25.33 22.67 28.67 22.67 32 32 C35.33 41.33 38.67 41.33 42 32" stroke-width="4.2"></path>
    </g>
  </svg>
      <span>TORQA</span>
    </span>
    <span style="flex: 1;"></span>
    <button style="width: 38px; height: 38px; display: grid; place-items: center; border-radius: var(--radius-sm); background: var(--bg-surface); box-shadow: var(--shadow-sm); border: 1px solid var(--panel-line); color: var(--text-secondary); transition: var(--transition-colors); cursor: pointer;" style-hover="color: var(--text)" title="Temă" onClick="{{ comutaTema }}">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect width="20" height="14" x="2" y="3" rx="2"></rect><path d="M8 21h8"></path><path d="M12 17v4"></path></svg>
    </button>
  </header>
  </sc-if>

  <div style="position: relative; z-index: 1; max-width: 1400px; margin: 0 auto; width: 100%;">
    <div style="padding: 24px; max-width: 920px; margin-left: auto; margin-right: auto;">

      <div style="display: flex; align-items: center; gap: 12px; padding: 0 2px 16px; flex-wrap: nowrap;">
        <button style="display: inline-flex; align-items: center; gap: 9px; flex: 0 1 auto; min-width: 0; overflow: hidden; min-height: 38px; padding: 0 14px; border-radius: var(--radius-xs); background: var(--bg-surface); border: 1px solid var(--panel-line); box-shadow: var(--shadow-sm); cursor: pointer; text-align: left; transition: var(--transition-colors);" style-hover="background: var(--bg-hover)" title="Vezi în Calendar">
          <span style="color: var(--accent); display: inline-flex;">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 10c0 4.993-5.539 10.193-7.399 11.799a1 1 0 0 1-1.202 0C9.539 20.193 4 14.993 4 10a8 8 0 0 1 16 0"></path><circle cx="12" cy="10" r="3"></circle></svg>
          </span>
          <span style="font-weight: var(--w-ctrl); font-size: 0.8125rem; color: var(--accent-deep); white-space: nowrap;">Mâine</span>
          <span style="font-size: 0.8125rem; color: var(--text); white-space: nowrap;">Continental</span>
          <span style="color: var(--text-dim);">·</span>
          <span style="font-size: 0.8125rem; color: var(--text-secondary); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 0 1 auto;">Deplasare Sibiu · PIF linie extrudare</span>
          <span style="font-family: var(--font-mono); font-size: 0.75rem; color: var(--text-dim); white-space: nowrap; flex: none;">24 aug–27 aug</span>
        </button>

        <span style="flex: 1 0 12px;"></span>

        <span style="display: inline-flex; align-items: center; gap: 8px; flex: none;">
          <button style="display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; font-size: 0.8125rem; padding: 4px 8px 4px 10px; border-radius: var(--radius-xs); background: var(--bg-surface); border: 1px solid var(--panel-line); box-shadow: var(--shadow-sm); color: var(--text-dim); cursor: pointer; transition: var(--transition-colors);" style-hover="background: var(--bg-hover); color: var(--text-secondary)" title="3 proiecte active fără nicio zi planificată">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M8 2v4"></path><path d="M16 2v4"></path><path d="M21 13V6a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h8"></path><path d="M3 10h18"></path><path d="m17 22 5-5"></path><path d="m17 17 5 5"></path></svg>
            <span style="font-family: var(--font-mono); font-variant-numeric: tabular-nums; color: var(--text-secondary);">3</span> fără perioadă
          </button>
          <button style="display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; font-size: 0.8125rem; padding: 4px 8px 4px 10px; border-radius: var(--radius-xs); background: var(--danger-subtle); border: 1px solid transparent; color: var(--danger-deep); cursor: pointer; transition: var(--transition-colors);" style-hover="background: color-mix(in oklab, var(--danger) 22%, var(--bg-surface))" title="Te duce la cea mai veche">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3"></path><path d="M12 9v4"></path><path d="M12 17h.01"></path></svg>
            <span style="font-family: var(--font-mono); font-variant-numeric: tabular-nums;">2</span> perioade trecute, proiect neînchis
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"></path></svg>
          </button>
        </span>
      </div>

      <section style="background: var(--bg-surface); border: 1px solid var(--panel-line); border-radius: var(--radius-md); box-shadow: var(--shadow-md); padding: 20px 8px 6px;">

        <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 0 8px 16px;">
          <div style="display: flex; align-items: baseline; gap: 12px; color: var(--text); min-width: 0;">
            <h2 style="font-family: var(--font-title); font-size: 1.5625rem; font-weight: var(--w-title); letter-spacing: var(--ls-title); margin: 0;">Astăzi</h2>
            <span style="font-size: 0.8125rem; font-weight: 500; color: var(--text-dim); white-space: nowrap;">{{ ziua }}</span>
            <span style="display: inline-flex; align-items: center; gap: 6px; flex: none; font-size: 0.8125rem; font-weight: var(--w-ctrl); color: var(--danger); white-space: nowrap;"><span style="width: 7px; height: 7px; border-radius: 50%; background: var(--danger);"></span>2 restante</span>
          </div>
          <button style="display: inline-flex; align-items: center; gap: 7px; height: 38px; padding: 0 14px; font-size: 0.9375rem; font-weight: var(--w-ctrl); border-radius: var(--radius-sm); background: var(--bg-elevated); border: 1px solid var(--panel-line); color: var(--text-secondary); cursor: pointer; transition: var(--transition-colors); flex-shrink: 0;" style-hover="background: var(--bg-hover); color: var(--text)">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M11 12H3"></path><path d="M16 6H3"></path><path d="M16 18H3"></path><path d="M18 9v6"></path><path d="M21 12h-6"></path></svg>
            <span>Adaugă task</span>
          </button>
        </div>

        <div style="display: flex; margin: 0 8px 16px;">
          <div style="flex: 1; min-width: 0; display: flex; align-items: center; gap: 10px; min-height: 44px; padding: 0 14px; background: var(--bg-elevated); border: 1px solid var(--border); border-radius: var(--radius-sm);">
            <span style="display: inline-flex; align-items: center; color: var(--text-dim); flex: none;" aria-hidden="true">
              <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"></path><path d="M12 5v14"></path></svg>
            </span>
            <span style="flex: 1; color: var(--text-dim); font-size: 0.9375rem;">Task rapid pentru azi, apoi Enter</span>
          </div>
        </div>

        <div style="display: flex; align-items: center; gap: 8px; padding: 14px 12px 4px; font-size: 0.75rem; font-weight: var(--w-ctrl); text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-secondary);">
          <span style="display: inline-flex; align-items: center; color: var(--text-dim); flex-shrink: 0;" aria-hidden="true">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M16 20V4a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"></path><rect width="20" height="14" x="2" y="6" rx="2"></rect></svg>
          </span>Muncă<span style="font-family: var(--font-mono); color: var(--text-dim); font-variant-numeric: tabular-nums; text-transform: none; letter-spacing: 0;">7</span>
        </div>

        <div role="list" style="display: flex; flex-direction: column; position: relative;">
          <sc-for list="{{ munca }}" as="it" hint-placeholder-count="7">
            <div role="listitem" style="--ring: {{ it.ring }}; position: relative; display: flex; align-items: center; gap: 12px; min-height: 46px; padding: 0 12px; border-radius: var(--radius-sm); transition: background-color .22s var(--ease);" style-hover="background: var(--bg-elevated); --acts: 1; --acts-pe: auto; --grip: 1">
              <sc-if value="{{ it.nuPrimul }}" hint-placeholder-val="{{ true }}"><span aria-hidden="true" style="position: absolute; top: 0; z-index: 2; left: 12px; right: 12px; height: 1px; background: var(--border);"></span></sc-if>

              <span style="width: 16px; flex: none; display: flex; align-items: center; justify-content: center; color: var(--text-secondary); cursor: grab; opacity: var(--grip, 0); transition: opacity .12s var(--ease);">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor"><circle cx="9" cy="12" r="1"></circle><circle cx="9" cy="5" r="1"></circle><circle cx="9" cy="19" r="1"></circle><circle cx="15" cy="12" r="1"></circle><circle cx="15" cy="5" r="1"></circle><circle cx="15" cy="19" r="1"></circle></svg>
              </span>

              <button style="flex-shrink: 0; color: var(--text-dim); cursor: pointer; padding: 2px; display: flex;" title="Marchează ca făcut">
                <span style="width: 18px; height: 18px; border: 1.5px solid var(--ring, var(--border-strong)); border-radius: 50%; flex: none; display: block;"></span>
              </button>

              <button style="flex: 1; min-width: 0; cursor: pointer; text-align: left; display: flex; flex-direction: column; gap: 1px;">
                <span style="display: flex; align-items: center; gap: 8px; min-width: 0; align-self: flex-start; max-width: 100%;">
                  <span style="font-size: 0.9375rem; color: var(--text); font-weight: var(--w-row); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0;">{{ it.titlu }}</span>
                  <sc-if value="{{ it.arePasi }}" hint-placeholder-val="{{ false }}">
                    <span role="img" style="flex: none; display: inline-flex; align-items: center; gap: 5px; font-size: 0.8125rem; color: var(--text-dim);" title="{{ it.pasiTitlu }}">
                      <svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true" style="flex: none; display: block;">
                        <circle cx="6" cy="6" r="4.5" fill="none" stroke="var(--border-strong)" stroke-width="3"></circle>
                        <circle cx="6" cy="6" r="4.5" fill="none" stroke="var(--text-dim)" stroke-width="3" stroke-dasharray="{{ it.dash }}" transform="rotate(-90 6 6)"></circle>
                      </svg>
                      <span style="font-variant-numeric: tabular-nums;">{{ it.pasi }}</span>
                    </span>
                  </sc-if>
                </span>
                <sc-if value="{{ it.context }}" hint-placeholder-val="{{ true }}">
                  <span style="display: flex; align-items: center; gap: 10px; min-width: 0; overflow: hidden; font-size: 0.8125rem; color: var(--text-dim);"><span style="flex: 0 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">{{ it.context }}</span></span>
                </sc-if>
              </button>

              <div style="display: flex; align-items: center; gap: 6px; flex-shrink: 0; opacity: var(--acts, 0); pointer-events: var(--acts-pe, none); transform: translateX(calc((1 - var(--acts, 0)) * 8px)); transition: opacity .22s var(--ease), transform .22s var(--ease);">
                <button style="display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 11px; border-radius: var(--radius-xs); background: var(--bg-surface); border: 1px solid var(--panel-line); box-shadow: var(--shadow-sm); color: var(--text-secondary); font-size: 0.8125rem; font-weight: var(--w-ctrl); white-space: nowrap; cursor: pointer; transition: var(--transition-colors);" style-hover="background: var(--bg-hover); color: var(--text)">
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"></path><path d="m12 5 7 7-7 7"></path></svg>Mâine
                </button>
                <button style="display: inline-flex; align-items: center; gap: 6px; flex-direction: row-reverse; height: 32px; padding: 0 11px; border-radius: var(--radius-xs); background: var(--bg-surface); border: 1px solid var(--panel-line); box-shadow: var(--shadow-sm); color: var(--text); font-size: 0.8125rem; font-weight: var(--w-ctrl); white-space: nowrap; cursor: pointer; transition: var(--transition-colors);" style-hover="background: var(--bg-hover)" title="Planifică pe altă zi">
                  <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="var(--text-dim)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0;"><path d="M8 2v4"></path><path d="M16 2v4"></path><rect width="18" height="18" x="3" y="4" rx="2"></rect><path d="M3 10h18"></path></svg>
                  <span>Altă zi</span>
                </button>
                <button style="display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 11px; border-radius: var(--radius-xs); background: var(--bg-surface); border: 1px solid var(--panel-line); box-shadow: var(--shadow-sm); color: var(--text-secondary); font-size: 0.8125rem; font-weight: var(--w-ctrl); white-space: nowrap; cursor: pointer; transition: var(--transition-colors);" style-hover="background: var(--danger-subtle); color: var(--danger-deep)" title="Scoate termenul">
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"></path><path d="m6 6 12 12"></path></svg>Scoate
                </button>
              </div>

              <span style="flex: none; width: 46px; text-align: right; font-family: var(--font-mono); font-size: 0.75rem; color: {{ it.termenCol }}; font-weight: {{ it.termenW }}; font-variant-numeric: tabular-nums; white-space: nowrap;">{{ it.termen }}</span>
            </div>
          </sc-for>
        </div>

        <div style="display: flex; align-items: center; gap: 8px; padding: 14px 12px 4px; margin-top: 8px; border-top: 1px solid var(--border); font-size: 0.75rem; font-weight: var(--w-ctrl); text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-secondary);">
          <span style="display: inline-flex; align-items: center; color: var(--text-dim); flex-shrink: 0;" aria-hidden="true">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
          </span>Personal<span style="font-family: var(--font-mono); color: var(--text-dim); font-variant-numeric: tabular-nums; text-transform: none; letter-spacing: 0;">2</span>
        </div>

        <div role="list" style="display: flex; flex-direction: column; position: relative;">
          <sc-for list="{{ personale }}" as="it" hint-placeholder-count="2">
            <div role="listitem" style="--ring: {{ it.ring }}; position: relative; display: flex; align-items: center; gap: 12px; min-height: 46px; padding: 0 12px; border-radius: var(--radius-sm); transition: background-color .22s var(--ease);" style-hover="background: var(--bg-elevated); --acts: 1; --acts-pe: auto">
              <sc-if value="{{ it.nuPrimul }}" hint-placeholder-val="{{ true }}"><span aria-hidden="true" style="position: absolute; top: 0; z-index: 2; left: 12px; right: 12px; height: 1px; background: var(--border);"></span></sc-if>
              <span style="width: 16px; flex: none; display: flex;" aria-hidden="true"></span>
              <button style="flex-shrink: 0; color: var(--text-dim); cursor: pointer; padding: 2px; display: flex;" title="Marchează ca făcut">
                <span style="width: 18px; height: 18px; border: 1.5px solid var(--ring, var(--border-strong)); border-radius: 50%; flex: none; display: block;"></span>
              </button>
              <button style="flex: 1; min-width: 0; cursor: pointer; text-align: left; display: flex; flex-direction: column;">
                <span style="font-size: 0.9375rem; color: var(--text); font-weight: var(--w-row); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; align-self: flex-start; max-width: 100%;">{{ it.titlu }}</span>
              </button>
              <div style="display: flex; align-items: center; gap: 6px; flex-shrink: 0; opacity: var(--acts, 0); pointer-events: var(--acts-pe, none); transform: translateX(calc((1 - var(--acts, 0)) * 8px)); transition: opacity .22s var(--ease), transform .22s var(--ease);">
                <button style="display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 11px; border-radius: var(--radius-xs); background: var(--bg-surface); border: 1px solid var(--panel-line); box-shadow: var(--shadow-sm); color: var(--text-secondary); font-size: 0.8125rem; font-weight: var(--w-ctrl); white-space: nowrap; cursor: pointer;" style-hover="background: var(--bg-hover); color: var(--text)">
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"></path><path d="m12 5 7 7-7 7"></path></svg>Mâine
                </button>
                <button style="display: inline-flex; align-items: center; gap: 6px; flex-direction: row-reverse; height: 32px; padding: 0 11px; border-radius: var(--radius-xs); background: var(--bg-surface); border: 1px solid var(--panel-line); box-shadow: var(--shadow-sm); color: var(--text); font-size: 0.8125rem; font-weight: var(--w-ctrl); white-space: nowrap; cursor: pointer;" style-hover="background: var(--bg-hover)">
                  <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="var(--text-dim)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0;"><path d="M8 2v4"></path><path d="M16 2v4"></path><rect width="18" height="18" x="3" y="4" rx="2"></rect><path d="M3 10h18"></path></svg>
                  <span>Altă zi</span>
                </button>
                <button style="display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 11px; border-radius: var(--radius-xs); background: var(--bg-surface); border: 1px solid var(--panel-line); box-shadow: var(--shadow-sm); color: var(--text-secondary); font-size: 0.8125rem; font-weight: var(--w-ctrl); white-space: nowrap; cursor: pointer;" style-hover="background: var(--danger-subtle); color: var(--danger-deep)">
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"></path><path d="m6 6 12 12"></path></svg>Scoate
                </button>
              </div>
              <span style="flex: none; width: 46px; text-align: right; font-family: var(--font-mono); font-size: 0.75rem; color: {{ it.termenCol }}; font-weight: {{ it.termenW }}; font-variant-numeric: tabular-nums; white-space: nowrap;">{{ it.termen }}</span>
            </div>
          </sc-for>
        </div>

      </section>
    </div>
  </div>

  <sc-if value="{{ dockJos }}" hint-placeholder-val="{{ true }}">
  <nav style="position: absolute; z-index: 3; left: 50%; bottom: 14px; transform: translateX(-50%); display: flex; gap: 4px; padding: 12px 8px 8px; border-radius: var(--radius-md); background: var(--bg-surface); border: 1px solid var(--panel-line); box-shadow: var(--shadow-md);">
    <span aria-hidden="true" style="position: absolute; top: 3px; left: 50%; transform: translateX(-50%); width: 30px; height: 3px; border-radius: var(--radius-full); background: var(--border-strong);"></span>
    <sc-for list="{{ nav }}" as="n" hint-placeholder-count="7">
      <span title="{{ n.label }}" style="width: 50px; height: 50px; border-radius: var(--radius-sm); color: {{ n.col }}; background: {{ n.bg }}; display: grid; place-items: center; cursor: pointer; transition: var(--transition-colors);">
        <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="{{ n.d }}" fill="currentColor" fill-rule="evenodd"></path></svg>
      </span>
    </sc-for>
    <span aria-hidden="true" style="width: 1px; background: var(--border-strong); margin: 10px 6px;"></span>
    <span title="Caută (Ctrl+K)" style="width: 50px; height: 50px; border-radius: var(--radius-sm); color: var(--text-secondary); display: grid; place-items: center; cursor: pointer; transition: var(--transition-colors);" style-hover="color: var(--text); background: var(--bg-hover)">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><path d="m21 21-4.3-4.3"></path></svg>
    </span>
  </nav>
  </sc-if>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1180,&quot;height&quot;:760},&quot;tema&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;dark&quot;,&quot;light&quot;],&quot;default&quot;:&quot;dark&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;dock&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;sus&quot;,&quot;jos&quot;],&quot;default&quot;:&quot;sus&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;varianta&quot;:{&quot;editor&quot;:null,&quot;default&quot;:&quot;aurora&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  static DATE = {
    munca: [
      { titlu: 'Citire log alarme AL-4 supratensiune la frânare', context: 'Continental Sibiu', k: -2, termen: '−2 z', total: 0, gata: 0 },
      { titlu: 'Trimite raportul PIF către client', context: 'Continental Sibiu', k: -1, termen: '−1 z', total: 0, gata: 0 },
      { titlu: 'Parametrizare ABB ACS880 — rampe și limite de cuplu', context: 'Aquatim Timișoara', k: 0, termen: '09:00', total: 5, gata: 2 },
      { titlu: 'Verificare cuplaj și sens de rotație pompa P-12', context: 'Aquatim Timișoara', k: 0, termen: 'azi', total: 0, gata: 0 },
      { titlu: 'Debrief parametri Siemens G120 — import arhivă', context: 'Aquatim Timișoara', k: 0, termen: 'azi', total: 3, gata: 1 },
      { titlu: 'Comandă piese de schimb — encoder HTL 1024 imp', context: 'Aprovizionare', k: 0, termen: '13:30', total: 0, gata: 0 },
      { titlu: 'Actualizare schemă electrică dulap DC-3', context: 'Hermes — retehnologizare', k: 0, termen: 'azi', total: 0, gata: 0 },
    ],
    personale: [
      { titlu: 'Programare ITP', k: -4, termen: '−4 z', total: 0, gata: 0 },
      { titlu: 'Plată abonament telefon', k: 0, termen: 'azi', total: 0, gata: 0 },
    ],
  }

  static ICO = {
    home: 'M11.3 2.7a1 1 0 0 1 1.4 0l8.6 7.5a1 1 0 0 1 .34.76V20a1.5 1.5 0 0 1-1.5 1.5h-4.3v-6a1 1 0 0 0-1-1h-3.6a1 1 0 0 0-1 1v6H4.85A1.5 1.5 0 0 1 3.35 20v-9.04a1 1 0 0 1 .34-.76z',
    projects: 'M4 4h5l2 2h7a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2z M7.5 11h1.6v5H7.5z M11.2 11h1.6v3H11.2z M14.9 11h1.6v6.5H14.9z',
    tasks: 'M4.5 4h4A1.5 1.5 0 0 1 10 5.5v3A1.5 1.5 0 0 1 8.5 10h-4A1.5 1.5 0 0 1 3 8.5v-3A1.5 1.5 0 0 1 4.5 4z M5.4 6.7l1.1 1.1 2.1-2.3.95.9-3.05 3.3-2-2z M13 5h7v2h-7z M13 11h7v2h-7z M13 17h7v2h-7z M4 14h6v2H4z',
    plan: 'M5 3h1.5v2H5zM17.5 3H19v2h-1.5z M4 6h16a1 1 0 0 1 1 1v12a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1z M6.5 10.2h6v1.8h-6z M9.5 13.6h7v1.8h-7z M6.5 17h4.5v1.8H6.5z',
    calendar: 'M5 3h1.5v2H5zM17.5 3H19v2h-1.5z M4 6h16a1 1 0 0 1 1 1v12a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1z M6.8 11h2.4v2.3H6.8z M10.8 11h2.4v2.3h-2.4z M14.8 11h2.4v2.3h-2.4z M6.8 15h2.4v2.3H6.8z M10.8 15h2.4v2.3h-2.4z',
    departament: 'M8 3.8a3.2 3.2 0 1 0 0 6.4 3.2 3.2 0 0 0 0-6.4z M16.6 4.6a2.7 2.7 0 1 0 0 5.4 2.7 2.7 0 0 0 0-5.4z M8 11.8c-2.9 0-5.3 1.7-5.3 3.9V20h10.6v-4.3c0-2.2-2.4-3.9-5.3-3.9z M16.6 11.4c-.9 0-1.7.2-2.4.5 1 .9 1.7 2.1 1.7 3.5V20h5.4v-4.6c0-2.2-2-4-4.7-4z',
    calculator: 'M6 3h12a1 1 0 0 1 1 1v16a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1z M8 6h8v3.5H8z M8.5 13a1 1 0 1 0 0 2 1 1 0 0 0 0-2z M12 13a1 1 0 1 0 0 2 1 1 0 0 0 0-2z M15.5 13a1 1 0 1 0 0 2 1 1 0 0 0 0-2z M8.5 16.7a1 1 0 1 0 0 2 1 1 0 0 0 0-2z M12 16.7a1 1 0 1 0 0 2 1 1 0 0 0 0-2z M15.5 16.7a1 1 0 1 0 0 2 1 1 0 0 0 0-2z',
  }

  state = { tema: null }
  barRef = React.createRef()

  legSticla(el) {
    if (!el || el.__lg) return
    el.__lg = true
    el.addEventListener('pointermove', (e) => {
      const r = el.getBoundingClientRect()
      el.style.setProperty('--mx', ((e.clientX - r.left) / r.width).toFixed(3))
      el.style.setProperty('--my', ((e.clientY - r.top) / r.height).toFixed(3))
      el.style.setProperty('--spec', '1')
    })
    el.addEventListener('pointerleave', () => el.style.setProperty('--spec', '0'))
  }

  componentDidMount() { this.legSticla(this.barRef.current) }
  componentDidUpdate() { this.legSticla(this.barRef.current) }

  get tema() { return this.state.tema || this.props.tema || 'dark' }

  rand(t, i) {
    const C = 2 * Math.PI * 4.5
    const frac = t.total ? Math.min(1, t.gata / t.total) : 0
    return {
      ...t,
      ring: t.k < 0 ? 'var(--danger)' : t.k === 0 ? 'var(--accent)' : 'var(--border-strong)',
      nuPrimul: i > 0,
      arePasi: !!t.total,
      pasi: t.total ? `${t.gata}/${t.total}` : '',
      pasiTitlu: t.total ? `${t.gata} din ${t.total} subtaskuri făcute` : '',
      dash: `${(frac * C).toFixed(3)} ${C.toFixed(3)}`,
      termenCol: t.k < 0 ? 'var(--danger)' : 'var(--text-dim)',
      termenW: t.k <= 0 ? 500 : 400,
    }
  }

  renderVals() {
    const barRef = this.barRef
    const C = this.constructor
    const s = new Date().toLocaleDateString('ro-RO', { weekday: 'long', day: 'numeric', month: 'long' })
    const I = C.ICO
    const nav = [
      ['Acasă', I.home, true], ['Proiecte', I.projects, false], ['Taskuri', I.tasks, false],
      ['Planificator', I.plan, false], ['Calendar', I.calendar, false],
      ['Departament', I.departament, false], ['Calculator', I.calculator, false],
    ].map(([label, d, activ]) => ({
      label, d,
      col: activ ? 'var(--text)' : 'var(--text-secondary)',
      bg: activ ? 'var(--glass-fill, var(--bg-elevated))' : 'transparent',
      ring: activ ? 'var(--glass-sel, none)' : 'none',
      w: activ ? 500 : 400,
    }))
    const dock = this.props.dock || 'sus'

    return {
      varianta: this.props.varianta || 'aurora',
      tema: this.tema,
      barRef,
      dockSus: dock === 'sus',
      dockJos: dock !== 'sus',
      ziua: s.charAt(0).toUpperCase() + s.slice(1),
      munca: C.DATE.munca.map((t, i) => this.rand(t, i)),
      personale: C.DATE.personale.map((t, i) => this.rand(t, i)),
      nav,
      comutaTema: () => this.setState({ tema: this.tema === 'dark' ? 'light' : 'dark' }),
    }
  }
}
</script>
</body>
</html>
