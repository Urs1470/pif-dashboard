<!DOCTYPE html>
<html lang="ro" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>PIF Dashboard — Autentificare</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

    <script>
        (function() {
            const saved = localStorage.getItem('theme');
            if (saved === 'light') {
                document.documentElement.setAttribute('data-theme', 'light');
            }
        })();
    </script>

    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='5' fill='%230a0d12'/%3E%3Cpath d='M19 4L10 17h7l-4 11 13-14h-8z' fill='%2358d1c9'/%3E%3Cpath d='M2 23 C4 23 5 20 7 20 C9 20 10 26 12 26' fill='none' stroke='%2358d1c9' stroke-width='1.5' stroke-linecap='round' opacity='0.7'/%3E%3C/svg%3E">
    <meta name="theme-color" content="#0a0d12">

    <style>
        :root {
            /* Backgrounds */
            --bg: #0a0d12;
            --bg-elev1: #11161e;
            --bg-elev2: #161c26;
            --bg-elev3: #1d2530;

            /* Accents */
            --accent: #58d1c9;
            --accent-soft: rgba(88,209,201,0.10);
            --accent-ring: rgba(88,209,201,0.25);
            --violet: #8b87ff;
            --violet-soft: rgba(139,135,255,0.12);

            /* Semantic */
            --success: #66d19e;
            --success-soft: rgba(102,209,158,0.12);
            --danger: #f97066;
            --danger-soft: rgba(249,112,102,0.12);
            --warning: #f5b14d;
            --warning-soft: rgba(245,177,77,0.12);

            /* Text */
            --text: #e8edf5;
            --text2: #8590a0;
            --text-dim: #5a6473;

            /* Lines */
            --border: #232b38;
            --line-soft: #1a212c;

            /* Typography */
            --font-sans: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            --font-mono: 'JetBrains Mono', 'Consolas', monospace;

            /* Spacing */
            --space-xs: 4px;
            --space-sm: 8px;
            --space-md: 16px;
            --space-lg: 24px;
            --space-xl: 32px;

            /* Radius */
            --radius-sm: 6px;
            --radius-md: 10px;
            --radius-lg: 14px;
        }

        [data-theme="light"] {
            --bg: #f5f7fb;
            --bg-elev1: #ffffff;
            --bg-elev2: #f1f4f9;
            --bg-elev3: #e6ebf2;
            --accent: #0d9488;
            --accent-soft: rgba(13,148,136,0.10);
            --accent-ring: rgba(13,148,136,0.25);
            --violet: #7c3aed;
            --violet-soft: rgba(124,58,237,0.10);
            --success: #16a34a;
            --success-soft: rgba(22,163,74,0.10);
            --danger: #dc2626;
            --danger-soft: rgba(220,38,38,0.10);
            --warning: #d97706;
            --warning-soft: rgba(217,119,6,0.10);
            --text: #1f2937;
            --text2: #5a6473;
            --text-dim: #94a3b8;
            --border: #dbe1ea;
            --line-soft: #eef1f6;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: var(--font-sans);
            background: var(--bg);
            background-image:
                radial-gradient(circle at 20% 10%, var(--accent-soft) 0%, transparent 45%),
                radial-gradient(circle at 80% 90%, var(--violet-soft) 0%, transparent 45%);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            line-height: 1.6;
            font-size: 0.95rem;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: var(--bg); }
        ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

        :focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 2px;
        }

        /* Lucide icons baseline */
        [data-lucide], .lucide {
            width: 18px;
            height: 18px;
            stroke-width: 1.75;
            vertical-align: middle;
        }

        /* Theme toggle */
        .theme-toggle {
            position: fixed;
            top: var(--space-md);
            right: var(--space-md);
            background: var(--bg-elev1);
            border: 1px solid var(--border);
            color: var(--text2);
            width: 40px;
            height: 40px;
            border-radius: var(--radius-md);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.15s ease;
            z-index: 100;
        }

        .theme-toggle:hover {
            background: var(--bg-elev2);
            border-color: var(--accent);
            color: var(--accent);
            transform: translateY(-1px);
        }

        .theme-toggle [data-lucide] { width: 18px; height: 18px; }

        /* Container */
        .login-container {
            background: var(--bg-elev1);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: var(--space-xl);
            width: 90%;
            max-width: 400px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.25);
        }

        .login-header {
            text-align: center;
            margin-bottom: var(--space-lg);
        }

        .login-logo {
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: var(--space-sm);
        }

        .logo-text {
            font-family: var(--font-mono);
            font-size: 2rem;
            font-weight: 600;
            letter-spacing: -0.02em;
            color: var(--text);
        }

        .logo-text .accent { color: var(--accent); }

        .cursor {
            display: inline-block;
            width: 10px;
            height: 22px;
            background: var(--accent);
            animation: blink 1s infinite;
            vertical-align: middle;
            margin-left: 2px;
            border-radius: 1px;
        }

        @keyframes blink {
            0%, 50% { opacity: 1; }
            51%, 100% { opacity: 0; }
        }

        .login-subtitle {
            color: var(--text2);
            font-size: 0.85rem;
            font-family: var(--font-mono);
            letter-spacing: 0.5px;
        }

        /* Form */
        .form-group { margin-bottom: var(--space-md); }

        .form-group label {
            display: block;
            margin-bottom: 6px;
            color: var(--text2);
            font-size: 0.75rem;
            font-family: var(--font-mono);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .form-group input {
            width: 100%;
            padding: 14px 16px;
            border: 1px solid var(--border);
            background: var(--bg);
            color: var(--text);
            font-size: 1.2rem;
            font-family: var(--font-mono);
            text-align: center;
            letter-spacing: 8px;
            transition: border-color 0.15s, box-shadow 0.15s;
            caret-color: var(--accent);
            border-radius: var(--radius-sm);
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-ring);
        }

        .form-group input::placeholder {
            color: var(--text-dim);
            letter-spacing: 4px;
        }

        /* Button */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: var(--space-xs);
            min-height: 48px;
            padding: 12px 24px;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.15s ease;
            border: none;
            font-family: var(--font-sans);
            width: 100%;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-radius: var(--radius-sm);
        }

        .btn-primary {
            background: var(--accent);
            color: var(--bg);
        }

        .btn-primary:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 16px var(--accent-ring);
        }

        .btn-primary:active { transform: translateY(0); }

        /* Error */
        .error-message {
            background: var(--danger-soft);
            border: 1px solid var(--danger);
            color: var(--danger);
            padding: 12px 16px;
            margin-bottom: var(--space-md);
            font-size: 0.85rem;
            font-family: var(--font-mono);
            display: none;
            border-radius: var(--radius-sm);
            letter-spacing: 0.3px;
        }

        .error-message.show { display: block; }

        /* Footer */
        .login-footer {
            text-align: center;
            margin-top: var(--space-lg);
            color: var(--text-dim);
            font-size: 0.75rem;
            font-family: var(--font-mono);
            letter-spacing: 0.5px;
        }

        /* Mobile */
        @media (max-width: 768px) {
            body { padding: var(--space-md); }
            .login-container { padding: var(--space-lg); width: 100%; }
            .form-group input { font-size: 16px; padding: 14px; }
            .theme-toggle { top: var(--space-sm); right: var(--space-sm); }
        }

        @media (max-width: 480px) {
            body { padding: var(--space-sm); }
            .login-container { padding: var(--space-md); }
            .logo-text { font-size: 1.6rem; }
            .cursor { height: 18px; }
        }
    </style>
</head>
<body>
    <button class="theme-toggle" id="theme-toggle" aria-label="Schimbă tema">
        <svg id="theme-icon-moon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"></path></svg>
        <svg id="theme-icon-sun" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" style="display:none"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2"></path><path d="M12 20v2"></path><path d="m4.93 4.93 1.41 1.41"></path><path d="m17.66 17.66 1.41 1.41"></path><path d="M2 12h2"></path><path d="M20 12h2"></path><path d="m6.34 17.66-1.41 1.41"></path><path d="m19.07 4.93-1.41 1.41"></path></svg>
    </button>

    <div class="login-container">
        <div class="login-header">
            <div class="login-logo">
                <span class="logo-text"><span class="accent">&gt;</span> pif<span class="cursor"></span></span>
            </div>
            <p class="login-subtitle">// INTRODU PIN-UL PENTRU ACCES //</p>
        </div>

        <div class="error-message" id="error-message">
            [EROARE] PIN incorect. Încearcă din nou.
        </div>

        <form id="login-form" onsubmit="handleLogin(event)">
            <div class="form-group">
                <label for="pin">Cod acces</label>
                <input
                    type="password"
                    id="pin"
                    placeholder="••••••"
                    autocomplete="current-password"
                    maxlength="20"
                    required
                    autofocus
                    inputmode="numeric"
                >
            </div>
            <button type="submit" class="btn btn-primary">Acces</button>
        </form>

        <div class="login-footer">
            PIF Dashboard v1.0
        </div>
    </div>

    <script>
        // Theme management (no external CDN dependency on login)
        function setTheme(theme) {
            document.documentElement.setAttribute('data-theme', theme);
            const moon = document.getElementById('theme-icon-moon');
            const sun = document.getElementById('theme-icon-sun');
            if (moon && sun) {
                moon.style.display = theme === 'dark' ? '' : 'none';
                sun.style.display  = theme === 'dark' ? 'none' : '';
            }
        }

        function toggleTheme() {
            const current = document.documentElement.getAttribute('data-theme');
            const next = current === 'light' ? 'dark' : 'light';
            setTheme(next);
            localStorage.setItem('theme', next);
        }

        function initTheme() {
            const saved = localStorage.getItem('theme') || 'dark';
            setTheme(saved);
        }

        document.getElementById('theme-toggle').addEventListener('click', toggleTheme);
        initTheme();

        // Login handler
        async function handleLogin(event) {
            event.preventDefault();
            const pin = document.getElementById('pin').value;
            const errorMessage = document.getElementById('error-message');

            try {
                const response = await fetch('/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'same-origin',
                    cache: 'no-store',
                    body: JSON.stringify({ pin: pin })
                });

                if (response.ok) {
                    window.location.href = '/';
                } else {
                    errorMessage.classList.add('show');
                    document.getElementById('pin').value = '';
                    document.getElementById('pin').focus();
                }
            } catch (error) {
                errorMessage.classList.add('show');
            }
        }

        document.getElementById('pin').addEventListener('input', function() {
            document.getElementById('error-message').classList.remove('show');
        });
    </script>
</body>
</html>
