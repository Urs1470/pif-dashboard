<!DOCTYPE html>
<html lang="ro" data-theme="dark">
<!-- data-theme de mai sus e doar valoarea de pornire; scriptul din <head> o corecteaza inainte de primul paint -->
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>TORQA — Autentificare</title>

    <link rel="preload" href="/static/fonts/HankenGrotesk-Variable.woff2" as="font" type="font/woff2" crossorigin>

    <script nonce="{{ csp_nonce }}">
        // TEMA URMEAZA SISTEMUL. Scriptul asta ruleaza inainte de primul paint si pune tema
        // dupa aceeasi regula de „mod" ca `aplicaTema()` de mai jos: fara el apare o clipa de
        // tema gresita la fiecare deschidere. Pagina nu incarca nimic din Torqa; stilul ei e
        // /static/login.css.
        (function() {
            var m = localStorage.getItem('theme-mod');
            if (m !== 'auto' && m !== 'light' && m !== 'dark') {
                localStorage.removeItem('theme');   // cheia veche, tema fixata
                m = 'auto';
                localStorage.setItem('theme-mod', m);
            }
            var t = m === 'auto'
                ? (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
                : m;
            document.documentElement.setAttribute('data-theme', t);
        })();
    </script>

    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2363638f'/%3E%3Cg fill='none' stroke='%23ffffff' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M14 32a18 18 0 1 0 36 0 18 18 0 1 0-36 0' stroke-width='5'/%3E%3Cpath d='M20 32c4-11.33 8-11.33 12 0s8 11.33 12 0' stroke-width='4.2'/%3E%3C/g%3E%3C/svg%3E">
    <meta name="theme-color" content="#15151a">

    <link rel="stylesheet" href="/static/login.css?v={{ style_version }}">
</head>
<body>
    <button class="theme-toggle" id="theme-toggle" aria-label="Schimbă tema">
        <svg id="theme-icon-moon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"></path></svg>
        <svg id="theme-icon-auto" class="theme-icon-hidden" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="20" height="14" rx="2"></rect><path d="M8 21h8"></path><path d="M12 17v4"></path></svg>
        <svg id="theme-icon-sun" class="theme-icon-hidden" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2"></path><path d="M12 20v2"></path><path d="m4.93 4.93 1.41 1.41"></path><path d="m17.66 17.66 1.41 1.41"></path><path d="M2 12h2"></path><path d="M20 12h2"></path><path d="m6.34 17.66-1.41 1.41"></path><path d="m19.07 4.93-1.41 1.41"></path></svg>
    </button>

    <div class="login-container">
        <div class="login-header">
            <div class="login-logo">
                <svg class="brand-logo" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                    <rect width="64" height="64" rx="14" fill="var(--accent)"/>
                    <g fill="none" stroke="var(--accent-text)" stroke-linecap="round" stroke-linejoin="round">
                      <path d="M14 32a18 18 0 1 0 36 0 18 18 0 1 0-36 0" stroke-width="5"/>
                      <path d="M20 32c4-11.33 8-11.33 12 0s8 11.33 12 0" stroke-width="4.2"/>
                    </g>
                </svg>
                <span class="brand-wordmark">TORQA</span>
            </div>
            <p class="login-subtitle">Introdu PIN-ul pentru acces</p>
        </div>

        <div class="error-message" id="error-message">
            PIN incorect. Încearcă din nou.
        </div>

        <form id="login-form" data-next="{{ next_url|default('/', true) }}">
            <div class="form-group">
                <label for="pin">Cod acces</label>
                <input
                    type="password"
                    id="pin"
                    placeholder="••••••"
                    autocomplete="current-password"
                    maxlength="20"
                    required
                    autofocus
                    inputmode="text"
                >
            </div>
            <button type="submit" class="btn btn-primary">Acces</button>
        </form>
    </div>

    <script nonce="{{ csp_nonce }}">
        // Theme management (no external CDN dependency on login)
        // Trei moduri, ca in aplicatie: auto (sistemul) / deschisa / inchisa.
        // Doua n-ar ajunge — prima atingere te-ar scoate din „auto" definitiv.
        const MODURI = ['auto', 'light', 'dark'];

        function temaSistemului() {
            return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }

        function modCurent() {
            const m = localStorage.getItem('theme-mod');
            return MODURI.indexOf(m) === -1 ? 'auto' : m;
        }

        function aplicaTema() {
            const mod = modCurent();
            const efectiv = mod === 'auto' ? temaSistemului() : mod;
            document.documentElement.setAttribute('data-theme', efectiv);
            const mc = document.querySelector('meta[name="theme-color"]');
            if (mc) mc.setAttribute('content', efectiv === 'dark' ? '#15151a' : '#f5f5f9');
            const icoane = { auto: 'theme-icon-auto', light: 'theme-icon-sun', dark: 'theme-icon-moon' };
            // Clasa, nu `style="display:none"`: politica de continut nu lasa atribute `style` inline.
            for (const [k, id] of Object.entries(icoane)) {
                const el = document.getElementById(id);
                if (!el) continue;
                if (k === mod) el.classList.remove('theme-icon-hidden');
                else el.classList.add('theme-icon-hidden');
            }
            const btn = document.getElementById('theme-toggle');
            if (btn) {
                btn.title = mod === 'auto'
                    ? 'Temă: automată (după sistem)'
                    : mod === 'light' ? 'Temă: deschisă' : 'Temă: închisă';
            }
        }

        function toggleTheme() {
            const mod = modCurent();
            const urm = mod === 'auto' ? 'light' : mod === 'light' ? 'dark' : 'auto';
            localStorage.setItem('theme-mod', urm);
            aplicaTema();
        }

        function initTheme() {
            aplicaTema();
            // Sistemul se poate schimba cat stai pe pagina (program de noapte).
            window.matchMedia('(prefers-color-scheme: dark)')
                .addEventListener('change', function () { if (modCurent() === 'auto') aplicaTema(); });
        }

        document.getElementById('theme-toggle').addEventListener('click', toggleTheme);
        initTheme();

        // Unde te intorci dupa PIN: `?next=` din adresa (ex. /torqa/), validat de server si
        // verificat inca o data aici. Doar o cale a acestui site — o singura `/` la inceput,
        // fara `\` (browserul il citeste ca `/`), doar ASCII tiparibil; orice altceva duce la
        // `/`. Oglindeste utils.safe_next_url (un test le compara).
        function destinatie(valoare) {
            const ok = typeof valoare === 'string' && valoare.length <= 2048 &&
                valoare.charAt(0) === '/' && valoare.charAt(1) !== '/' &&
                /^[!-~]+$/.test(valoare) && valoare.indexOf('\\') === -1;
            return ok ? valoare : '/';
        }

        // Login handler
        async function handleLogin(event) {
            event.preventDefault();
            const pin = document.getElementById('pin').value;
            const errorMessage = document.getElementById('error-message');
            const next = destinatie(document.getElementById('login-form').dataset.next);

            try {
                const response = await fetch('/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'same-origin',
                    cache: 'no-store',
                    body: JSON.stringify({ pin: pin, next: next })
                });

                if (response.ok) {
                    let raspuns = null;
                    try { raspuns = await response.json(); } catch (e) { /* ramane `/` */ }
                    window.location.href = destinatie(raspuns && raspuns.next);
                } else {
                    gresit();
                }
            } catch (error) {
                gresit();
            }
        }

        // Golim campul si ne intoarcem in el — deci semnalul trebuie sa fie SI pe
        // camp, nu doar pe randul de deasupra: acolo s-a intors cursorul.
        function gresit() {
            const camp = document.getElementById('pin');
            document.getElementById('error-message').classList.add('show');
            camp.classList.add('eroare');
            camp.setAttribute('aria-invalid', 'true');
            camp.value = '';
            camp.focus();
        }

        // Legat de aici, nu cu `onsubmit="..."` in HTML: politica de continut (app.py) nu lasa
        // handlere inline, doar scripturi cu nonce.
        document.getElementById('login-form').addEventListener('submit', handleLogin);

        document.getElementById('pin').addEventListener('input', function() {
            document.getElementById('error-message').classList.remove('show');
            this.classList.remove('eroare');
            this.removeAttribute('aria-invalid');
        });
    </script>
</body>
</html>
