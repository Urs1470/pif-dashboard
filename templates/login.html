<!DOCTYPE html>
<html lang="ro" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>PIF Dashboard — Autentificare</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

    <script nonce="{{ csp_nonce }}">
        (function() {
            const saved = localStorage.getItem('theme');
            if (saved === 'light') {
                document.documentElement.setAttribute('data-theme', 'light');
            }
        })();
    </script>

    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230070f3'/%3E%3Cpath d='M14 48 C27 48 30 40 33 30 S42 16 50 16 L50 48 Z' fill='%23ffffff' opacity='0.3'/%3E%3Cpath d='M14 48 C27 48 30 40 33 30 S42 16 50 16' fill='none' stroke='%23ffffff' stroke-width='5.5' stroke-linecap='round'/%3E%3Ccircle cx='50' cy='16' r='5' fill='%23ffffff'/%3E%3C/svg%3E">
    <meta name="theme-color" content="#000000">

    <link rel="stylesheet" href="/static/login.css?v={{ style_version }}">
</head>
<body>
    <button class="theme-toggle" id="theme-toggle" aria-label="Schimbă tema">
        <svg id="theme-icon-moon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"></path></svg>
        <svg id="theme-icon-sun" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" style="display:none"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2"></path><path d="M12 20v2"></path><path d="m4.93 4.93 1.41 1.41"></path><path d="m17.66 17.66 1.41 1.41"></path><path d="M2 12h2"></path><path d="M20 12h2"></path><path d="m6.34 17.66-1.41 1.41"></path><path d="m19.07 4.93-1.41 1.41"></path></svg>
    </button>

    <div class="login-container">
        <div class="login-header">
            <div class="login-logo">
                <svg class="brand-logo" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                    <rect width="32" height="32" rx="7" fill="var(--accent)"/>
                    <path d="M7 24 C13.5 24 15 20 16.5 15 S21 8 25 8 L25 24 Z" fill="var(--accent-text)" opacity="0.3"/>
                    <path d="M7 24 C13.5 24 15 20 16.5 15 S21 8 25 8" fill="none" stroke="var(--accent-text)" stroke-width="2.75" stroke-linecap="round"/>
                    <circle cx="25" cy="8" r="2.5" fill="var(--accent-text)"/>
                </svg>
                <span class="brand-wordmark">PIF Dashboard</span>
            </div>
            <p class="login-subtitle">Introdu PIN-ul pentru acces</p>
        </div>

        <div class="error-message" id="error-message">
            PIN incorect. Incearca din nou.
        </div>

        <form id="login-form" onsubmit="handleLogin(event)">
            <div class="form-group">
                <label for="pin">Cod acces</label>
                <input
                    type="password"
                    id="pin"
                    placeholder="••••••"
                    autocomplete="current-password"
                    maxlength="20"
                    required
                    autofocus
                    inputmode="text"
                >
            </div>
            <button type="submit" class="btn btn-primary">Acces</button>
        </form>
    </div>

    <script nonce="{{ csp_nonce }}">
        // Theme management (no external CDN dependency on login)
        function setTheme(theme) {
            document.documentElement.setAttribute('data-theme', theme);
            const moon = document.getElementById('theme-icon-moon');
            const sun = document.getElementById('theme-icon-sun');
            if (moon && sun) {
                moon.style.display = theme === 'dark' ? '' : 'none';
                sun.style.display  = theme === 'dark' ? 'none' : '';
            }
        }

        function toggleTheme() {
            const current = document.documentElement.getAttribute('data-theme');
            const next = current === 'light' ? 'dark' : 'light';
            setTheme(next);
            localStorage.setItem('theme', next);
        }

        function initTheme() {
            const saved = localStorage.getItem('theme') || 'dark';
            setTheme(saved);
        }

        document.getElementById('theme-toggle').addEventListener('click', toggleTheme);
        initTheme();

        // Login handler
        async function handleLogin(event) {
            event.preventDefault();
            const pin = document.getElementById('pin').value;
            const errorMessage = document.getElementById('error-message');

            try {
                const response = await fetch('/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'same-origin',
                    cache: 'no-store',
                    body: JSON.stringify({ pin: pin })
                });

                if (response.ok) {
                    window.location.href = '/';
                } else {
                    errorMessage.classList.add('show');
                    document.getElementById('pin').value = '';
                    document.getElementById('pin').focus();
                }
            } catch (error) {
                errorMessage.classList.add('show');
            }
        }

        document.getElementById('pin').addEventListener('input', function() {
            document.getElementById('error-message').classList.remove('show');
        });
    </script>
</body>
</html>
