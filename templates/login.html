<!DOCTYPE html>
<html lang="ro" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PIF Dashboard - Autentificare</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230f172a'/%3E%3Ccircle cx='16' cy='16' r='13' fill='none' stroke='%2338bdf8' stroke-width='1' opacity='0.4'/%3E%3Ccircle cx='16' cy='16' r='10' fill='%230d1f35'/%3E%3Cpath d='M18.5 7L11 17h6l-3.5 8L26 14h-7z' fill='%2338bdf8'/%3E%3C/svg%3E">
    <meta name="theme-color" content="#0f172a">
    <style>
        :root {
            --bg: #0a0e17;
            --bg2: #111827;
            --bg3: #1a2236;
            --accent: #00d4ff;
            --accent2: #7c3aed;
            --accent3: #10b981;
            --danger: #ef4444;
            --text: #e2e8f0;
            --text2: #94a3b8;
            --border: #1e293b;
            --font-body: 0.95rem;
            --space-xs: 4px;
            --space-sm: 8px;
            --space-md: 16px;
            --space-lg: 24px;
            --space-xl: 32px;
            --radius-md: 8px;
            --radius-lg: 12px;
            --shadow-md: 0 4px 20px rgba(0, 212, 255, 0.1);
        }

        [data-theme="light"] {
            --bg: #f8fafc;
            --bg2: #ffffff;
            --bg3: #f1f5f9;
            --accent: #0284c7;
            --accent2: #7c3aed;
            --accent3: #059669;
            --danger: #dc2626;
            --text: #0f172a;
            --text2: #475569;
            --border: #e2e8f0;
            --shadow-md: 0 4px 20px rgba(2, 132, 199, 0.1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            line-height: 1.6;
            font-size: var(--font-body);
        }

        .login-container {
            background: var(--bg2);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: var(--space-xl);
            width: 90%;
            max-width: 400px;
            box-shadow: var(--shadow-md);
        }

        .login-header {
            text-align: center;
            margin-bottom: var(--space-lg);
        }

        .login-logo {
            width: 80px;
            height: 80px;
            margin: 0 auto var(--space-md);
        }

        .login-title {
            font-size: 1.5rem;
            font-weight: 700;
            background: linear-gradient(135deg, var(--accent), var(--accent2));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: var(--space-xs);
        }

        .login-subtitle {
            color: var(--text2);
            font-size: 0.9rem;
        }

        .form-group {
            margin-bottom: var(--space-md);
        }

        .form-group label {
            display: block;
            margin-bottom: 6px;
            color: var(--text2);
            font-size: 0.9rem;
            font-weight: 500;
        }

        .form-group input {
            width: 100%;
            padding: 14px 16px;
            border-radius: var(--radius-md);
            border: 1.5px solid var(--border);
            background: var(--bg);
            color: var(--text);
            font-size: 1rem;
            font-family: inherit;
            transition: border-color 0.2s;
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--accent);
        }

        .form-group input::placeholder {
            color: var(--text2);
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: var(--space-xs);
            min-height: 48px;
            padding: 12px 24px;
            border-radius: var(--radius-md);
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            border: none;
            font-family: inherit;
            width: 100%;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--accent), var(--accent2));
            color: #000;
        }

        .btn-primary:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 15px rgba(0, 212, 255, 0.3);
        }

        .btn-primary:active {
            transform: translateY(0);
        }

        .error-message {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid var(--danger);
            color: var(--danger);
            padding: 12px 16px;
            border-radius: var(--radius-md);
            margin-bottom: var(--space-md);
            font-size: 0.9rem;
            display: none;
        }

        .error-message.show {
            display: block;
        }

        .login-footer {
            text-align: center;
            margin-top: var(--space-lg);
            color: var(--text2);
            font-size: 0.85rem;
        }

        .theme-toggle {
            position: absolute;
            top: var(--space-md);
            right: var(--space-md);
            background: var(--bg3);
            border: 1px solid var(--border);
            color: var(--text);
            width: 44px;
            height: 44px;
            border-radius: var(--radius-md);
            cursor: pointer;
            font-size: 1.2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.2s, background 0.2s;
        }

        .theme-toggle:hover {
            transform: translateY(-1px);
            background: var(--bg2);
        }
    </style>
</head>
<body>
    <button class="theme-toggle" id="theme-toggle" aria-label="Toggle theme">🌙</button>

    <div class="login-container">
        <div class="login-header">
            <svg class="login-logo" viewBox="0 0 80 80" xmlns="http://www.w3.org/2000/svg">
                <circle cx="40" cy="40" r="36" fill="none" stroke="var(--accent)" stroke-width="1.5" opacity="0.2"/>
                <circle cx="40" cy="40" r="28" fill="none" stroke="var(--accent)" stroke-width="1" opacity="0.15"/>
                <circle cx="40" cy="40" r="22" fill="var(--bg3)" stroke="var(--border)" stroke-width="1"/>
                <ellipse cx="40" cy="40" rx="10" ry="13" fill="var(--accent)" opacity="0.3"/>
                <path d="M46 22L30 40h12l-5 18 20-25h-10z" fill="var(--accent)"/>
            </svg>
            <h1 class="login-title">PIF Dashboard</h1>
            <p class="login-subtitle">Introduceți PIN-ul pentru acces</p>
        </div>

        <div class="error-message" id="error-message">
            PIN incorect. Încercați din nou.
        </div>

        <form id="login-form" onsubmit="handleLogin(event)">
            <div class="form-group">
                <label for="pin">PIN</label>
                <input
                    type="password"
                    id="pin"
                    placeholder="••••"
                    autocomplete="current-password"
                    maxlength="20"
                    required
                    autofocus
                >
            </div>
            <button type="submit" class="btn btn-primary">Autentificare</button>
        </form>

        <div class="login-footer">
            PIF Dashboard v1.0
        </div>
    </div>

    <script>
        // Theme management
        function initTheme() {
            const savedTheme = localStorage.getItem('pif-theme') || 'dark';
            setTheme(savedTheme);
        }

        function toggleTheme() {
            const html = document.documentElement;
            const currentTheme = html.getAttribute('data-theme');
            const newTheme = currentTheme === 'light' ? 'dark' : 'light';
            setTheme(newTheme);
            localStorage.setItem('pif-theme', newTheme);
        }

        function setTheme(theme) {
            document.documentElement.setAttribute('data-theme', theme);
            document.getElementById('theme-toggle').textContent = theme === 'dark' ? '🌙' : '☀️';
        }

        document.getElementById('theme-toggle').addEventListener('click', toggleTheme);
        initTheme();

        // Login handler
        async function handleLogin(event) {
            event.preventDefault();
            const pin = document.getElementById('pin').value;
            const errorMessage = document.getElementById('error-message');

            try {
                const response = await fetch('/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ pin: pin })
                });

                if (response.ok) {
                    // Redirect to main page
                    window.location.href = '/';
                } else {
                    errorMessage.classList.add('show');
                    document.getElementById('pin').value = '';
                    document.getElementById('pin').focus();
                }
            } catch (error) {
                errorMessage.classList.add('show');
            }
        }

        // Clear error on input
        document.getElementById('pin').addEventListener('input', function() {
            document.getElementById('error-message').classList.remove('show');
        });
    </script>
</body>
</html>
